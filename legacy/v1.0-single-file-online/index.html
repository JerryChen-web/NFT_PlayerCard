<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Player Card Exchange v3</title>
  <style>
    :root{
      --bg:#11110f;
      --bg-soft:#171815;
      --surface:#1f211d;
      --surface-2:#282a25;
      --surface-3:#303329;
      --ink:#f7f2e8;
      --muted:#b9b0a4;
      --dim:#80786d;
      --line:rgba(247,242,232,.15);
      --line-strong:rgba(247,242,232,.26);
      --gold:#e6b85c;
      --teal:#3fd0c9;
      --red:#e55d4f;
      --green:#78c66d;
      --blue:#6aa7ff;
      --violet:#b590ff;
      --paper:#f4ead9;
      --paper-ink:#201b15;
      --shadow:0 18px 46px rgba(0,0,0,.32);
      --radius:8px;
      --font-sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
      --font-mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{overflow-x:hidden}
    body{
      margin:0;
      color:var(--ink);
      background:
        linear-gradient(120deg, rgba(63,208,201,.11), transparent 34%),
        linear-gradient(250deg, rgba(230,184,92,.12), transparent 40%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 26px),
        var(--bg);
      font-family:var(--font-sans);
      overflow:hidden;
      overflow-x:hidden;
    }

    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    a{color:inherit}
    img{display:block;max-width:100%}

    .app-shell{
      height:100vh;
      width:100%;
      max-width:100%;
      display:grid;
      grid-template-columns:268px minmax(0,1fr);
      isolation:isolate;
    }

    .sidebar{
      display:flex;
      flex-direction:column;
      min-height:0;
      min-width:0;
      padding:18px;
      background:
        linear-gradient(180deg, rgba(31,33,29,.98), rgba(17,17,15,.98)),
        repeating-linear-gradient(0deg, transparent 0 14px, rgba(255,255,255,.025) 14px 15px);
      border-right:1px solid var(--line);
      box-shadow:16px 0 44px rgba(0,0,0,.25);
      z-index:2;
    }

    .brand{
      display:grid;
      grid-template-columns:48px minmax(0,1fr);
      gap:12px;
      align-items:center;
      padding:6px 0 18px;
      border-bottom:1px solid var(--line);
    }

    .brand-mark{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      border-radius:8px;
      color:#16120c;
      font-weight:900;
      letter-spacing:.5px;
      background:linear-gradient(135deg,var(--teal),var(--gold) 56%,var(--red));
      box-shadow:0 14px 30px rgba(230,184,92,.18);
    }

    .brand h1{
      margin:0;
      font-size:19px;
      line-height:1.15;
      letter-spacing:0;
    }
    .brand p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
      padding:16px 0;
      overflow:auto;
    }

    .nav-btn{
      display:grid;
      grid-template-columns:32px minmax(0,1fr);
      align-items:center;
      gap:10px;
      width:100%;
      min-height:48px;
      color:var(--muted);
      background:transparent;
      border:1px solid transparent;
      border-radius:8px;
      padding:8px;
      text-align:left;
      transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
    }
    .nav-btn:hover{background:rgba(255,255,255,.055);color:var(--ink);transform:translateX(2px)}
    .nav-btn.active{
      color:var(--ink);
      background:linear-gradient(135deg, rgba(63,208,201,.16), rgba(230,184,92,.13));
      border-color:rgba(230,184,92,.36);
    }
    .nav-ico{
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      border-radius:8px;
      background:rgba(255,255,255,.08);
      color:var(--gold);
      font-weight:850;
    }
    .nav-btn strong{
      display:block;
      font-size:14px;
      line-height:1.1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .nav-btn small{
      display:block;
      margin-top:3px;
      color:var(--dim);
      font-size:11px;
      line-height:1.1;
    }

    .wallet{
      margin-top:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      overflow:hidden;
    }
    .wallet-main{padding:14px}
    .wallet-label{
      display:flex;
      justify-content:space-between;
      gap:10px;
      color:var(--dim);
      font-family:var(--font-mono);
      font-size:11px;
      letter-spacing:.3px;
    }
    .wallet-value{
      display:flex;
      align-items:baseline;
      gap:7px;
      margin:8px 0 10px;
      font-family:var(--font-mono);
      font-size:28px;
      color:#fff;
    }
    .wallet-value small{font-size:13px;color:var(--muted)}
    .meter{
      height:7px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      overflow:hidden;
    }
    .meter span{
      display:block;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--red),var(--gold),var(--teal));
    }
    .wallet-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:0 14px 14px;
    }

    .main{
      display:flex;
      min-width:0;
      min-height:0;
      flex-direction:column;
    }

    .topbar{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:18px;
      align-items:center;
      min-height:78px;
      padding:14px 24px;
      border-bottom:1px solid var(--line);
      background:rgba(23,24,21,.78);
      backdrop-filter:blur(16px);
      z-index:1;
    }
    .page-title{
      display:grid;
      grid-template-columns:42px minmax(0,1fr);
      gap:12px;
      align-items:center;
      min-width:0;
    }
    .page-seal{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:8px;
      color:var(--paper-ink);
      font-weight:900;
      background:linear-gradient(135deg,var(--gold),var(--paper));
      border:1px solid rgba(255,255,255,.18);
    }
    .page-title h2{
      margin:0;
      font-size:22px;
      line-height:1.16;
      letter-spacing:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .page-title p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .top-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }

    .view-wrap{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:22px 24px 30px;
      width:100%;
      max-width:1760px;
      margin:0 auto;
    }
    .view{display:none}
    .view.active{display:block;animation:fadeIn .22s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    .grid{display:grid;gap:14px}
    .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .align-start{align-items:start}
    .mt-14{margin-top:14px}
    .mt-18{margin-top:18px}
    .mb-0{margin-bottom:0}

    .panel{
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(31,33,29,.88);
      box-shadow:var(--shadow);
    }
    .panel-pad{padding:18px}
    .panel h3,.panel h4{margin:0;color:#fff;letter-spacing:0}
    .panel h3{font-size:20px;line-height:1.2}
    .panel h4{font-size:15px;line-height:1.25}
    .panel p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}

    .hero-grid{
      display:grid;
      grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);
      gap:14px;
      align-items:stretch;
    }
    .brief{
      display:grid;
      gap:18px;
      align-content:space-between;
      min-height:420px;
      padding:22px;
      background:
        linear-gradient(135deg, rgba(63,208,201,.13), transparent 34%),
        linear-gradient(290deg, rgba(229,93,79,.13), transparent 44%),
        rgba(31,33,29,.9);
    }
    .brief-kicker{
      display:inline-flex;
      width:max-content;
      max-width:100%;
      gap:8px;
      align-items:center;
      border:1px solid rgba(230,184,92,.34);
      border-radius:8px;
      padding:7px 9px;
      color:var(--gold);
      background:rgba(230,184,92,.08);
      font-size:12px;
      font-weight:800;
    }
    .brief h2{
      margin:0;
      max-width:780px;
      font-size:38px;
      line-height:1.08;
      letter-spacing:0;
      color:#fff;
    }
    .brief p{
      max-width:780px;
      font-size:15px;
    }
    .pipeline{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:8px;
    }
    .pipe-step{
      min-height:84px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.05);
    }
    .pipe-step b{display:block;color:#fff;font-size:13px}
    .pipe-step span{display:block;margin-top:6px;color:var(--muted);font-size:12px;line-height:1.35}

    .stat-tile{
      min-height:118px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.045);
    }
    .stat-tile span{display:block;color:var(--dim);font-size:12px}
    .stat-tile strong{
      display:block;
      margin-top:10px;
      color:#fff;
      font-family:var(--font-mono);
      font-size:28px;
      line-height:1;
      overflow-wrap:anywhere;
    }
    .stat-tile p{font-size:12px}

    .card-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
      gap:14px;
    }

    .player-card{
      position:relative;
      min-width:0;
      overflow:hidden;
      border:1px solid var(--line);
      border:1px solid color-mix(in srgb, var(--rarity-color, var(--line-strong)) 45%, var(--line));
      border-radius:8px;
      background:var(--surface);
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--team-a, #3fd0c9) 18%, transparent), transparent 38%),
        linear-gradient(315deg, color-mix(in srgb, var(--team-b, #e6b85c) 16%, transparent), transparent 48%),
        var(--surface);
      box-shadow:0 18px 44px rgba(0,0,0,.28);
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    }
    .player-card:hover{
      transform:translateY(-2px);
      border-color:var(--rarity-color, var(--gold));
      border-color:color-mix(in srgb, var(--rarity-color, var(--gold)) 65%, white 5%);
      box-shadow:0 22px 54px rgba(0,0,0,.36);
    }
    .player-card.effect-goal,.player-card.effect-homer,.player-card.effect-award{
      animation:pulseGlow 1.1s ease both;
    }
    .player-card.anim-live{
      animation:cardFloat 7s ease-in-out infinite;
    }
    .player-card.anim-live::after{
      content:"";
      position:absolute;
      inset:-1px;
      pointer-events:none;
      z-index:0;
      opacity:.34;
      background:
        linear-gradient(115deg, transparent 0 28%, color-mix(in srgb, var(--rarity-color, var(--gold)) 32%, transparent) 48%, transparent 66%),
        radial-gradient(circle at 16% 18%, color-mix(in srgb, var(--rarity-color, var(--gold)) 26%, transparent), transparent 34%);
      transform:translateX(-38%);
      animation:raritySweep 5.8s ease-in-out infinite;
    }
    .player-card.rarity-common.anim-live::after{opacity:.12;animation-duration:8s}
    .player-card.rarity-uncommon.anim-live::after{opacity:.18;animation-duration:7.2s}
    .player-card.rarity-rare.anim-live::after{opacity:.28}
    .player-card.rarity-superRare.anim-live::after{opacity:.34}
    .player-card.rarity-epic.anim-live::after{opacity:.45;background:
      radial-gradient(circle at 20% 20%, rgba(181,144,255,.34), transparent 18%),
      radial-gradient(circle at 82% 38%, rgba(63,208,201,.24), transparent 20%),
      linear-gradient(115deg, transparent 0 30%, rgba(181,144,255,.26) 48%, transparent 68%)}
    .player-card.rarity-legendary.anim-live::after{opacity:.52;background:
      radial-gradient(circle at 50% 0, rgba(230,184,92,.34), transparent 34%),
      linear-gradient(115deg, transparent 0 24%, rgba(255,231,160,.32) 48%, transparent 70%)}
    .player-card.rarity-mythic.anim-live::after,.player-card.rarity-limited.anim-live::after,.player-card.rarity-oneOfOne.anim-live::after{opacity:.62;animation-duration:4.6s}
    .player-card.rarity-oneOfOne.anim-live::after{
      background:linear-gradient(115deg, transparent 0 20%, rgba(63,208,201,.24), rgba(230,184,92,.34), rgba(181,144,255,.28), transparent 72%);
    }
    @keyframes pulseGlow{
      0%{box-shadow:0 0 0 rgba(230,184,92,0)}
      34%{box-shadow:0 0 0 4px rgba(230,184,92,.28),0 22px 64px rgba(0,0,0,.42);box-shadow:0 0 0 4px color-mix(in srgb, var(--rarity-color, var(--gold)) 45%, transparent),0 22px 64px rgba(0,0,0,.42)}
      100%{box-shadow:0 18px 44px rgba(0,0,0,.28)}
    }
    @keyframes raritySweep{
      0%,100%{transform:translateX(-42%) skewX(-8deg)}
      50%{transform:translateX(42%) skewX(-8deg)}
    }
    @keyframes cardFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-3px)}
    }
    body.animations-off .player-card,
    body.animations-off .player-card::before,
    body.animations-off .player-card::after{
      animation:none!important;
    }

    .card-topline{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      padding:11px 12px;
      min-height:46px;
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.16);
    }
    .serial{
      color:var(--muted);
      font-family:var(--font-mono);
      font-size:11px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .rarity-pill,.status-pill,.badge,.source-pill{
      display:inline-flex;
      align-items:center;
      min-height:25px;
      max-width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      padding:4px 8px;
      color:#fff;
      background:rgba(255,255,255,.07);
      font-size:11px;
      font-weight:800;
      line-height:1.2;
      overflow-wrap:anywhere;
    }
    .rarity-pill{border-color:var(--rarity-color,var(--gold));border-color:color-mix(in srgb, var(--rarity-color, var(--gold)) 55%, var(--line));color:var(--rarity-color,var(--gold))}
    .status-pill.warning{border-color:rgba(229,93,79,.48);color:#ffb1a8;background:rgba(229,93,79,.11)}
    .status-pill.special{border-color:rgba(120,198,109,.48);color:#bdf5b7;background:rgba(120,198,109,.11)}

    .media-frame{
      position:relative;
      height:248px;
      overflow:hidden;
      background:linear-gradient(150deg, rgba(63,208,201,.24), rgba(230,184,92,.18)), var(--surface-2);
      background:
        linear-gradient(150deg, color-mix(in srgb, var(--team-a,#3fd0c9) 42%, #20221e), color-mix(in srgb, var(--team-b,#e6b85c) 34%, #11110f)),
        var(--surface-2);
    }
    .media-frame::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:58%;
      background:linear-gradient(180deg, transparent, rgba(0,0,0,.72));
      pointer-events:none;
    }
    .media-frame img.player-img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center top;
      filter:saturate(1.08) contrast(1.03);
    }
    .media-frame.is-fallback img.player-img{display:none}
    .media-frame.is-fallback::before{
      content:"";
      position:absolute;
      inset:16px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:8px;
      opacity:.75;
      pointer-events:none;
    }
    .media-soccer.is-fallback{
      background:
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.10) 1px, transparent 1px),
        linear-gradient(150deg, rgba(63,208,201,.26), rgba(230,184,92,.16)),
        var(--surface-2);
      background-size:42px 42px,42px 42px,auto,auto;
    }
    .media-basketball.is-fallback{
      background:
        radial-gradient(circle at 50% 50%, transparent 0 31%, rgba(255,255,255,.18) 32% 33%, transparent 34%),
        linear-gradient(90deg, transparent 49%, rgba(255,255,255,.14) 50%, transparent 51%),
        linear-gradient(150deg, rgba(230,184,92,.28), rgba(229,93,79,.18)),
        var(--surface-2);
    }
    .media-baseball.is-fallback{
      background:
        radial-gradient(circle at 20% 48%, transparent 0 34%, rgba(255,255,255,.18) 35% 36%, transparent 37%),
        radial-gradient(circle at 80% 52%, transparent 0 34%, rgba(255,255,255,.18) 35% 36%, transparent 37%),
        repeating-linear-gradient(58deg, transparent 0 18px, rgba(229,93,79,.22) 18px 20px, transparent 20px 30px),
        linear-gradient(150deg, rgba(229,93,79,.25), rgba(230,184,92,.17)),
        var(--surface-2);
    }
    .fallback-initials{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:rgba(255,255,255,.88);
      font-weight:950;
      font-size:58px;
      letter-spacing:0;
      text-shadow:0 4px 22px rgba(0,0,0,.36);
    }
    .media-frame:not(.is-fallback) .fallback-initials{display:none}
    .fallback-note{
      position:absolute;
      left:12px;
      bottom:76px;
      z-index:2;
      max-width:calc(100% - 92px);
      display:none;
      border:1px solid rgba(255,255,255,.22);
      border-radius:8px;
      padding:6px 8px;
      background:rgba(0,0,0,.34);
      color:#fff;
      font-family:var(--font-mono);
      font-size:10px;
      line-height:1.35;
      overflow-wrap:anywhere;
    }
    .media-frame.is-fallback .fallback-note{display:block}
    .team-logo{
      position:absolute;
      right:12px;
      bottom:12px;
      width:54px;
      height:54px;
      z-index:2;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.38);
      border-radius:8px;
      background:rgba(255,255,255,.9);
      box-shadow:0 10px 26px rgba(0,0,0,.28);
      overflow:hidden;
    }
    .team-logo img{
      width:42px;
      height:42px;
      object-fit:contain;
    }
    .team-logo.logo-failed::before{
      content:attr(data-code);
      color:#1c1710;
      font-weight:900;
      font-size:13px;
    }
    .media-label{
      position:absolute;
      left:12px;
      bottom:12px;
      z-index:2;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      max-width:calc(100% - 82px);
    }

    .card-body{
      display:grid;
      gap:12px;
      padding:14px;
    }
    .name-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:start;
      gap:10px;
    }
    .player-name{
      margin:0;
      color:#fff;
      font-size:22px;
      line-height:1.08;
      letter-spacing:0;
      overflow-wrap:anywhere;
    }
    .team-line{
      margin:5px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }
    .number-chip{
      min-width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:8px;
      color:#fff;
      background:rgba(0,0,0,.18);
      font-family:var(--font-mono);
      font-weight:900;
    }
    .badge-row{display:flex;flex-wrap:wrap;gap:6px}
    .stats{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .stat-box{
      min-height:62px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:8px;
      background:rgba(255,255,255,.045);
    }
    .stat-box span{
      display:block;
      color:var(--dim);
      font-size:10px;
      font-family:var(--font-mono);
      line-height:1.1;
      text-transform:uppercase;
    }
    .stat-box b{
      display:block;
      margin-top:7px;
      color:#fff;
      font-size:18px;
      line-height:1;
      font-family:var(--font-mono);
      overflow-wrap:anywhere;
    }
    .value-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-size:12px;
    }

      Object.entries(TopRosters).forEach(([sport, rows]) => {
        let rank = cards.filter((card) => card.sport === sport).length + 1;
        rows.forEach((row) => {
          if(cards.filter((card) => card.sport === sport).length >= 50) return;
          if(existing.has(row[0])) return;
          const card = makeGeneratedCard(sport, row, rank);
          cards.push(card);
          existing.add(card.playerName);
          rank += 1;
        });
      });
      return cards;
    }

    function enrichCards(cards){
      cards.forEach((card, index) => enrichCard(card, index + 1));
    }

    function makeGeneratedCard(sport, row, rank){
      const [playerName, team, league, position, jerseyNumber, nationality, continent] = row;
      const code = sport === "soccer" ? "SC" : sport === "basketball" ? "BK" : "BB";
      const rarity = rarityByRank(rank);
      const mlbId = sport === "baseball" ? (MLBPlayerIds[playerName] || "") : "";
      const card = {
        id:`card_${sport}_${slug(playerName)}`,
        tokenId:`DSP-2026-${code}-${String(rank).padStart(3,"0")}`,
        sport, playerName, team, teamCode:teamCode(team), league, position, jerseyNumber, nationality, continent,
        mlbId,
        rarity, price:priceByRank(rank, sport), owner:null, serial:`${code}-${String(rank).padStart(3,"0")}/${rarity === "oneOfOne" ? "001" : rarity === "limited" ? "500" : rarity === "legendary" ? "700" : "1500"}`,
        status:"Active", version:1, lastUpdate:"2026-05-20T00:00:00+08:00",
        imageUrl:sport === "baseball" ? getBaseballHeadshot(playerName, mlbId) : "",
        logoUrl:sport === "baseball" ? (MLBTeamLogoMap[team] || "") : "",
        teamColors:teamColors(team, sport), badges:badgesFor(sport, position, rank),
        stats:statsByRank(sport, rank, position),
        metadata:{sourceUrl:leagueHub(sport), dataSource:"demo; pending official verification; needs source verification", animationUrl:`dsp-player-card-v3.html#${slug(playerName)}`},
        history:[{at:"2026-05-20T00:00:00+08:00", type:"SEED_PENDING_VERIFY", note:"Expanded demo roster card generated from public top-player context; official biography/social verification pending."}],
        licenseNote:"Demo roster entry. Official images, marks, social accounts and live statistics require formal rights verification before commercial use."
      };
      enrichCard(card, rank);
      return card;
    }

    function enrichCard(card, rank = 25){
      card.birthDate = card.birthDate || "pending official verification";
      card.birthPlace = card.birthPlace || "pending official verification";
      card.height = card.height || "pending official verification";
      card.weight = card.weight || "pending official verification";
      card.skills = card.skills || skillsFor(card.sport, card.position, rank);
      card.abilityStats = card.abilityStats || abilityFor(card.sport, card.position, card.rarity, rank);
      card.playerEra = card.playerEra || playerEraFor(card);
      card.era = card.era || {status:card.playerEra, primeYears:card.playerEra === "Active" ? "current" : "legacy archive", generation:card.playerEra === "Active" ? "modern" : "legend"};
      card.legacyStats = card.legacyStats || legacyStatsFor(card);
      const featuredProfile = FeaturedProfiles[card.playerName];
      if(featuredProfile){
        ["careerSummary","biography","careerHighlights","majorAwards","records","playStyle","collectorValue"].forEach((key) => {
          if(featuredProfile[key]) card[key] = clone(featuredProfile[key]);
        });
        if(featuredProfile.socialLinks) card.socialLinks = {...(card.socialLinks || {}), ...featuredProfile.socialLinks};
        if(featuredProfile.officialSources) card.officialSources = clone(featuredProfile.officialSources);
        card.sourceStatus = featuredProfile.sourceStatus || "Verified Seed Link / Demo Use";
      }
      card.majorAwards = card.majorAwards || awardsFor(card.sport, rank, card.playerName);
      card.records = card.records || recordsFor(card.sport, rank, card.playerName);
      card.careerHighlights = card.careerHighlights || highlightsFor(card);
      card.playStyle = card.playStyle || playStyleFor(card);
      card.collectorValue = card.collectorValue || collectorTextFor(card);
      card.careerSummary = card.careerSummary || summaryFor(card);
      card.biography = card.biography || biographyFor(card);
      card.localized = card.localized || localizedFor(card);
      card.socialLinks = {...emptySocialLinks(), ...(card.socialLinks || {}), ...(VerifiedSocials[card.playerName] || {})};
      card.socialLinks = normalizeSocialLinks(card.socialLinks, card.sourceStatus || (VerifiedSocials[card.playerName] ? "Verified Seed Link" : "Pending Official Verification"));
      card.imageSourceStatus = card.imageSourceStatus || (card.imageUrl ? "official image seed / demo use" : card.sport === "baseball" && !card.mlbId ? "fallback generated card art; MLB ID pending verification" : "fallback generated card art");
      card.assetStatus = card.assetStatus || {
        playerImage:card.imageUrl ? "available" : "fallback",
        teamLogo:card.logoUrl ? "available" : "fallback",
        license:"classroom demo only; commercial use requires formal authorization"
      };
      card.officialSources = card.officialSources || officialSourcesFor(card);
      card.marketData = ensureMarketData(card);
      card.introAnimation = card.introAnimation || getIntroAnimation(card);
      card.rarityEffect = card.rarityEffect || rarityEffectFor(card);
      card.metadata = {...(card.metadata || {}), tokenURI:`ipfs://demo/dynamic-player-card/${card.tokenId}`};
      card.metadataVersions = card.metadataVersions || [{version:card.version || 1, at:card.lastUpdate || nowISO(), reason:"Initial metadata snapshot"}];
      card.sourceStatus = card.sourceStatus || (VerifiedSocials[card.playerName] ? "seed profile partly verified from official/league pages" : "demo; pending official verification; needs source verification");
      return card;
    }

    // StarterCards is initialized after the featured card seed list below.

    function rarityByRank(rank){
      if(rank === 1) return "oneOfOne";
      if(rank <= 3) return "limited";
      if(rank <= 7) return "mythic";
      if(rank <= 14) return "legendary";
      if(rank <= 22) return "epic";
      if(rank <= 32) return "superRare";
      if(rank <= 42) return "rare";
      if(rank <= 48) return "uncommon";
      return "common";
    }

    function priceByRank(rank, sport){
      const base = sport === "basketball" ? .42 : sport === "baseball" ? .38 : .4;
      return Number((base + Math.max(0, 52 - rank) * .037).toFixed(2));
    }

    function statsByRank(sport, rank, position){
      const boost = Math.max(0, 54 - rank);
      if(sport === "soccer") return {goals:Math.round(5 + boost * .72), assists:Math.round(3 + boost * .36), appearances:Math.round(18 + boost * .18), shots:Math.round(30 + boost * 1.8), passPct:Number((78 + boost * .28).toFixed(1)), minutes:Math.round(1120 + boost * 34)};
      if(sport === "basketball") return {points:Number((15 + boost * .32).toFixed(1)), rebounds:Number((3.8 + boost * .14).toFixed(1)), assists:Number((3.2 + boost * .13).toFixed(1)), steals:Number((.7 + boost * .012).toFixed(1)), blocks:Number((.3 + boost * .012).toFixed(1)), fgPct:Number((43 + boost * .18).toFixed(1))};
      const pitcher = /Pitcher/i.test(position);
      if(pitcher) return {avg:0, homeRuns:0, rbi:0, ops:0, era:Number((3.7 - boost * .032).toFixed(2)), whip:Number((1.25 - boost * .006).toFixed(2)), strikeouts:Math.round(120 + boost * 3.5)};
      return {avg:Number((.245 + boost * .0017).toFixed(3)), homeRuns:Math.round(14 + boost * .63), rbi:Math.round(52 + boost * 1.25), ops:Number((.735 + boost * .0062).toFixed(3)), stolenBases:Math.round(4 + boost * .36), strikeouts:0};
    }

    function abilityFor(sport, position, rarity, rank){
      const tier = Rarity[rarity]?.weight || 1;
      const top = Math.round(98 - rank * .55 + tier * 1.3);
      const archetype = /Goalkeeper|Pitcher|Center Back|Defensive|Catcher/i.test(position) ? "defense" : /Winger|Guard|Shortstop|Outfield/i.test(position) ? "speed" : /Striker|Forward|DH|First Base/i.test(position) ? "attack" : "skill";
      const base = clamp(top, 72, 99);
      return {
        ovr:base,
        attack:clamp(base + (archetype === "attack" ? 4 : sport === "baseball" ? 2 : 0), 55, 99),
        defense:clamp(base + (archetype === "defense" ? 4 : -2), 50, 99),
        speed:clamp(base + (archetype === "speed" ? 4 : -1), 50, 99),
        skill:clamp(base + (archetype === "skill" ? 4 : 1), 55, 99),
        stamina:clamp(base - 1 + (rank < 15 ? 2 : 0), 55, 99),
        clutch:clamp(base + (rank < 10 ? 4 : 0), 55, 99),
        potential:clamp(base + (rank > 20 ? 3 : 1), 55, 99),
        marketHeat:clamp(94 - rank * .6 + tier * 2, 45, 99)
      };
    }

    function skillsFor(sport, position, rank){
      const pool = sport === "soccer"
        ? ["Vision Pass","Finisher","Golden Boot DNA","Captain Mentality","Speed Demon","Defensive Wall","Playmaker","Record Breaker"]
        : sport === "basketball"
          ? ["Deep Range","Triple-Double Engine","Clutch Shot","Two-Way Legend","Playmaker","Defensive Wall","Finisher","Captain Mentality"]
          : ["Power Hitter","Home Run Threat","Record Breaker","Clutch Shot","Speed Demon","Defensive Wall","Playmaker","Captain Mentality"];
      const offset = Math.abs(hashCode(position)) % pool.length;
      const count = rank < 10 ? 4 : rank < 28 ? 3 : 2;
      return Array.from({length:count}, (_, index) => pool[(offset + index) % pool.length]);
    }

    function badgesFor(sport, position, rank){
      const first = sport === "soccer" ? "Global XI" : sport === "basketball" ? "All-NBA Tier" : "All-Star Tier";
      const role = /Goalkeeper|Pitcher|Catcher|Defensive|Back|Center/i.test(position) ? "Defensive Wall" : /Guard|Midfielder|Shortstop/i.test(position) ? "Playmaker" : "Finisher";
      return [first, role, rank <= 10 ? "Market Heat" : "Scout Pick"];
    }

    function awardsFor(sport, rank, name){
      if(rank <= 3) return ["Global superstar tier", "MVP / Ballon d'Or conversation", "Signature collector edition"];
      if(rank <= 12) return ["League award contender", "All-star or elite team recognition", "Featured chase card"];
      if(sport === "baseball") return ["All-Star caliber profile", "Advanced-stat standout", "Postseason upside"];
      if(sport === "basketball") return ["All-NBA caliber profile", "Franchise cornerstone traits", "Playoff impact"];
      return ["International-level profile", "Club cornerstone traits", "Major competition upside"];
    }

    function recordsFor(sport, rank, name){
      const headline = rank <= 5 ? "Historic pace / generational profile" : rank <= 18 ? "Elite single-season and playoff indicators" : "Rising or established top-50 profile";
      return [headline, `${name} card record tracked by demo oracle history`, "Official record verification pending"];
    }

    function highlightsFor(card){
      return [
        `${card.playerName} is modeled as a top-tier ${card.position} in ${card.league}.`,
        `The card tracks ${Sports[card.sport]?.label || card.sport} performance signals, special-event badges and metadata versions.`,
        `Collector demand is weighted by rarity, market heat, skill tags and social influence.`
      ];
    }

    function summaryFor(card){
      return `${card.playerName} is positioned as a premium ${card.sport} collectible from ${card.team}, combining performance identity, market heat, rarity and dynamic metadata into one evolving player card.`;
    }

    function biographyFor(card){
      const sportLabel = Sports[card.sport]?.label || card.sport;
      return [
        `${card.playerName} enters this Dynamic NFT database as a ${nationalityText(card.nationality)} ${sportLabel} star associated with ${card.team} in ${card.league}. The profile is structured like an official player page: background fields, team context, performance identity, awards, records and source notes are kept together so the card can be used for presentation and future verification.`,
        `Early-career details such as birth date, birth place, height and weight are intentionally marked pending when they have not been verified from official league or club sources in this local build. The card still preserves the data slots so a production version can replace demo text with licensed, audited biography copy.`,
        `Professionally, this card emphasizes the player's role as ${card.position}. The front card highlights OVR, major skills and live market signals, while the detail modal keeps longer career story, awards, records, play style and collector value analysis.`,
        `As a collectible, ${card.playerName} is valuable because the card can evolve. Oracle events may upgrade stats, ability ratings, market heat, rarity and metadata history, turning a static player profile into a dynamic digital artwork with an auditable transaction trail.`
      ].join("\n\n");
    }

    function playStyleFor(card){
      const skills = (card.skills || []).join(", ");
      return `${card.playerName} is represented as a ${card.position} whose card identity centers on ${skills || "elite fundamentals"}. The ability model balances performance traits with collectible readability rather than claiming live scouting accuracy.`;
    }

    function collectorTextFor(card){
      return `Collectors may value this card for name recognition, ${Rarity[card.rarity]?.label || card.rarity} scarcity, ${card.abilityStats?.marketHeat || 70} market heat and its ability to record event-driven upgrades. Risk remains tied to licensing, live-data verification and market volatility.`;
    }

    function officialSourcesFor(card){
      const links = VerifiedSocials[card.playerName] || {};
      const leagueProfile = socialUrl(links.leagueProfile);
      const teamProfile = socialUrl(links.teamProfile);
      const instagram = socialUrl(links.instagram);
      const x = socialUrl(links.x);
      return [
        {label:"League / team profile", url:leagueProfile || teamProfile || card.metadata?.sourceUrl || leagueHub(card.sport), status:leagueProfile || teamProfile ? "Verified Seed Link" : "Pending Official Verification"},
        {label:"Social accounts", url:instagram || x || "", status:instagram || x ? "Verified Seed Link" : "Pending Official Verification"},
        {label:"Data source status", url:"", status:card.sourceStatus || "demo; needs source verification"}
      ];
    }

    function marketDataFor(card){
      const heat = card.abilityStats?.marketHeat || 70;
      const socialCount = Object.values(card.socialLinks || {}).filter((entry) => socialUrl(entry)).length;
      return {
        primary:true,
        listingType:card.owner ? "secondary" : "primary",
        listed:false,
        askingPrice:Number((card.price * (Rarity[card.rarity]?.multiplier || 1)).toFixed(2)),
        floorPrice:Number((card.price * .82).toFixed(2)),
        lastSale:Number((card.price * .96).toFixed(2)),
        volume:Number((card.price * (3 + heat / 11)).toFixed(2)),
        owner:card.owner || "issuer",
        seller:"",
        creatorRoyalty:5,
        gasFee:Number((.002 + heat / 100000).toFixed(4)),
        marketHeat:heat,
        socialInfluence:clamp(50 + socialCount * 9 + (card.abilityStats?.ovr || 75) / 4, 35, 99),
        collectorDemand:clamp(55 + (Rarity[card.rarity]?.weight || 1) * 7 + heat / 6, 40, 99),
        watchlisted:false,
        offers:[],
        priceHistory:[]
      };
    }

    function ensureMarketData(card){
      const defaults = marketDataFor(card);
      const existing = card.marketData || {};
      return {
        ...defaults,
        ...existing,
        owner:existing.owner || card.owner || defaults.owner,
        seller:existing.seller || "",
        listingType:existing.listingType || (card.owner && card.owner !== "issuer" ? "secondary" : "primary"),
        askingPrice:Number(existing.askingPrice || defaults.askingPrice || card.price || 0),
        creatorRoyalty:Number(existing.creatorRoyalty ?? defaults.creatorRoyalty),
        gasFee:Number(existing.gasFee ?? defaults.gasFee),
        offers:Array.isArray(existing.offers) ? existing.offers : [],
        priceHistory:Array.isArray(existing.priceHistory) ? existing.priceHistory : []
      };
    }

    function playerEraFor(card){
      const legends = new Set(["Cristiano Ronaldo","Neymar Jr.","Kevin Durant","LeBron James","Stephen Curry"]);
      const retired = new Set([""]);
      if(retired.has(card.playerName)) return "Retired";
      if(legends.has(card.playerName)) return "Legend";
      return "Active";
    }

    function legacyStatsFor(card){
      const ovr = card.abilityStats?.ovr || 75;
      const heat = card.abilityStats?.marketHeat || 60;
      const bonus = card.playerEra === "Legend" ? 10 : card.playerEra === "Retired" ? 8 : 0;
      return {
        legacyScore:clamp(Math.round(ovr * .72 + bonus), 1, 99),
        historicalImpact:clamp(Math.round(ovr * .64 + bonus), 1, 99),
        culturalInfluence:clamp(Math.round(heat * .66 + bonus), 1, 99),
        collectorDemand:clamp(Math.round((card.marketData?.collectorDemand || heat) * .7 + bonus), 1, 99)
      };
    }

    function localizedFor(card){
      const featured = typeof FeaturedLocalized !== "undefined" ? FeaturedLocalized[card.playerName] : null;
      if(featured) return clone(featured);
      return {
        en:{
          careerSummary:card.careerSummary || summaryFor(card),
          biography:card.biography || biographyFor(card),
          playStyle:card.playStyle || playStyleFor(card),
          collectorValue:card.collectorValue || collectorTextFor(card),
          careerHighlights:card.careerHighlights || [],
          majorAwards:card.majorAwards || [],
          records:card.records || [],
          translationStatus:"Demo Summary / Translation pending"
        }
      };
    }

    function rarityEffectFor(card){
      return RarityVisualEffects[card.rarity] || RarityVisualEffects.common;
    }

    function getIntroAnimation(card){
      const featured = typeof FeaturedIntroAnimations !== "undefined" ? FeaturedIntroAnimations[card.playerName] : null;
      const colors = card.teamColors || [Sports[card.sport]?.tone || "#3fd0c9", Rarity[card.rarity]?.color || "#e6b85c"];
      if(featured) return {...featured, colors, replayable:true};
      const position = String(card.position || "").toLowerCase();
      let theme = "signature_grid";
      let title = "Dynamic Card Reveal";
      let motifs = ["card seal", "rarity glow", `number ${card.jerseyNumber || "-"}`];
      if(card.sport === "soccer"){
        if(position.includes("goalkeeper")){ theme = "keeper_wall"; title = "Keeper Wall Reveal"; motifs = ["save gloves","box line","defense shield"]; }
        else if(position.includes("back")){ theme = "defense_wall"; title = "Defensive Wall Reveal"; motifs = ["shield","interception line","back line"]; }
        else if(position.includes("mid")){ theme = "passing_map"; title = "Midfield Vision Reveal"; motifs = ["passing lanes","center circle","tempo pulse"]; }
        else { theme = "goal_flash"; title = "Golden Goal Reveal"; motifs = ["shot trail","goal net","gold flash"]; }
      }
      if(card.sport === "basketball"){
        if(position.includes("center")){ theme = "paint_engine"; title = "Paint Engine Reveal"; motifs = ["paint lane","rebound ripple","triple track"]; }
        else if(position.includes("forward")){ theme = "power_drive"; title = "Power Drive Reveal"; motifs = ["court burst","crown flare","rim impact"]; }
        else { theme = "guard_arc"; title = "Guard Arc Reveal"; motifs = ["dribble rhythm","three-point arc","arena lights"]; }
      }
      if(card.sport === "baseball"){
        if(position.includes("pitcher")){ theme = "pitch_spin"; title = "Pitch Spin Reveal"; motifs = ["seam rotation","pitch trail","strike K"]; }
        else if(position.includes("catcher")){ theme = "plate_command"; title = "Plate Command Reveal"; motifs = ["home plate","defense frame","signal lines"]; }
        else { theme = "bat_swing"; title = "Home Plate Reveal"; motifs = ["bat swing","home-run trail","base path"]; }
      }
      return {type:"generated", theme, title, subtitle:`${card.playerName} reveal generated from sport, position and rarity.`, colors, motifs, duration:card.rarity === "mythic" || card.rarity === "limited" || card.rarity === "oneOfOne" ? 2300 : 1800, replayable:true};
    }

    function emptySocialLinks(){
      return {
        instagram:{handle:"", url:"", status:"Pending Official Verification"},
        x:{handle:"", url:"", status:"Pending Official Verification"},
        facebook:{handle:"", url:"", status:"Pending Official Verification"},
        youtube:{handle:"", url:"", status:"Pending Official Verification"},
        tiktok:{handle:"", url:"", status:"Pending Official Verification"},
        officialWebsite:{label:"Official Website", url:"", status:"Pending Official Verification"},
        leagueProfile:{label:"League Profile", url:"", status:"Pending Official Verification"},
        teamProfile:{label:"Team Profile", url:"", status:"Pending Official Verification"}
      };
    }

    function normalizeSocialLinks(links = {}, defaultStatus = "Pending Official Verification"){
      const base = emptySocialLinks();
      Object.entries(base).forEach(([key, fallback]) => {
        const value = links[key];
        if(typeof value === "string"){
          base[key] = {...fallback, url:value, handle:handleFromUrl(key, value), status:value ? defaultStatus : fallback.status};
        }else if(value && typeof value === "object"){
          const url = value.url || "";
          base[key] = {...fallback, ...value, url, handle:value.handle || handleFromUrl(key, url), status:value.status || (url ? defaultStatus : fallback.status)};
        }
      });
      return base;
    }

    function handleFromUrl(key, url){
      if(!url) return "";
      const clean = String(url).replace(/\/+$/,"");
      if(["instagram","x","facebook","tiktok"].includes(key)){
        const part = clean.split("/").filter(Boolean).pop() || "";
        return part && !part.includes(".") ? part.replace(/^@/,"") : "";
      }
      return "";
    }

    function socialUrl(entry){
      if(!entry) return "";
      return typeof entry === "string" ? entry : entry.url || "";
    }

    function leagueHub(sport){
      if(sport === "basketball") return "https://www.nba.com/players";
      if(sport === "baseball") return "https://www.mlb.com/players";
      return "https://www.fifa.com/";
    }

    function getBaseballHeadshot(playerName, mlbId){
      return mlbId ? `https://img.mlbstatic.com/mlb-photos/image/upload/v1/people/${mlbId}/headshot/67/current` : "";
    }

    function teamColors(team, sport){
      const palette = [["#3fd0c9","#e6b85c"],["#6aa7ff","#f7f2e8"],["#e55d4f","#e6b85c"],["#b590ff","#3fd0c9"],["#78c66d","#e6b85c"]];
      return palette[Math.abs(hashCode(team + sport)) % palette.length];
    }

    function teamCode(team){
      return String(team || "DSP").replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(Boolean).map((part) => part[0]).join("").slice(0,3).toUpperCase() || "DSP";
    }

    function nationalityText(value){
      return value ? `${value}-connected` : "international";
    }

    function slug(value){
      return String(value || "card").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
    }

    function hashCode(value){
      return String(value).split("").reduce((hash, char) => ((hash << 5) - hash + char.charCodeAt(0)) | 0, 0);
    }

    const Sports = {
      soccer:{
        label:"足球",
        short:"Football",
        tone:"#3fd0c9",
        stats:["goals","assists","appearances","shots","passPct","minutes"],
        defaultStats:{goals:8, assists:5, appearances:12, shots:38, passPct:84.2, minutes:980}
      },
      basketball:{
        label:"籃球",
        short:"Basketball",
        tone:"#e6b85c",
        stats:["points","rebounds","assists","steals","blocks","fgPct"],
        defaultStats:{points:24.8, rebounds:7.2, assists:7.6, steals:1.1, blocks:.6, fgPct:51.2}
      },
      baseball:{
        label:"棒球",
        short:"Baseball",
        tone:"#e55d4f",
        stats:["avg","homeRuns","rbi","ops","stolenBases","strikeouts"],
        defaultStats:{avg:.292, homeRuns:34, rbi:92, ops:.948, stolenBases:12, strikeouts:0}
      }
    };

    const Rarity = {
      common:{label:"Common", color:"#a7b1b7", glow:"rgba(167,177,183,.20)", multiplier:1, weight:1, drop:"46%", market:"Entry-level star card"},
      uncommon:{label:"Uncommon", color:"#78c66d", glow:"rgba(120,198,109,.22)", multiplier:1.12, weight:1.35, drop:"24%", market:"Early collector pick"},
      rare:{label:"Rare", color:"#3fd0c9", glow:"rgba(63,208,201,.24)", multiplier:1.28, weight:2, drop:"15%", market:"High-upside active star"},
      superRare:{label:"Super Rare", color:"#6aa7ff", glow:"rgba(106,167,255,.25)", multiplier:1.46, weight:2.5, drop:"8%", market:"Premium starter"},
      epic:{label:"Epic", color:"#b590ff", glow:"rgba(181,144,255,.27)", multiplier:1.72, weight:3, drop:"4%", market:"Signature performance card"},
      legendary:{label:"Legendary", color:"#e6b85c", glow:"rgba(230,184,92,.30)", multiplier:2.25, weight:4, drop:"2%", market:"GOAT / MVP tier"},
      mythic:{label:"Mythic", color:"#ff6b5f", glow:"rgba(255,107,95,.34)", multiplier:2.85, weight:4.7, drop:"0.7%", market:"Record-breaking chase card"},
      limited:{label:"Limited", color:"#ff8db4", glow:"rgba(255,141,180,.34)", multiplier:3.2, weight:5.2, drop:"0.25%", market:"Numbered event edition"},
      oneOfOne:{label:"One of One", color:"#f7f2e8", glow:"rgba(247,242,232,.42)", multiplier:5.6, weight:7, drop:"1/1", market:"Unique grail card"}
    };

          const haystack = `${card.playerName} ${card.team} ${card.league} ${card.nationality} ${card.position} ${(card.skills || []).join(" ")}`.toLowerCase();
          return sportOK && leagueOK && rarityOK && eraOK && (!keyword || haystack.includes(keyword));
        });
        return sortCards(filtered, this.state.sortBy);
      }
    };

    function mergeCardDefaults(saved, defaults){
      const savedById = new Map(saved.map((card) => [card.id, card]));
      const merged = defaults.map((base) => {
        const existing = savedById.get(base.id);
        const next = existing ? {...base, ...existing, stats:{...(base.stats || {}), ...(existing.stats || {})}, metadata:{...(base.metadata || {}), ...(existing.metadata || {})}} : base;
        if(!next.mlbId && base.mlbId) next.mlbId = base.mlbId;
        if(!next.imageUrl && base.imageUrl) next.imageUrl = base.imageUrl;
        if(!next.logoUrl && base.logoUrl) next.logoUrl = base.logoUrl;
        if(next.imageUrl && /fallback/i.test(next.imageSourceStatus || "")) next.imageSourceStatus = "";
        if(next.logoUrl && next.assetStatus?.teamLogo === "fallback") next.assetStatus.teamLogo = "available";
        return enrichCard(next);
      });
      saved.forEach((card) => {
        if(!merged.some((item) => item.id === card.id)) merged.push(enrichCard(card));
      });
      return merged;
    }

    function sortCards(cards, sortBy){
      const list = cards.slice();
      const key = sortBy || "marketHeat";
      list.sort((a,b) => {
        if(key === "priceAsc") return ValueModel.estimate(a) - ValueModel.estimate(b);
        if(key === "priceDesc") return ValueModel.estimate(b) - ValueModel.estimate(a);
        if(key === "ovr") return (b.abilityStats?.ovr || 0) - (a.abilityStats?.ovr || 0);
        if(key === "recent") return new Date(b.lastUpdate) - new Date(a.lastUpdate);
        if(key === "rarity") return rarityOrder.indexOf(b.rarity) - rarityOrder.indexOf(a.rarity);
        return (b.marketData?.marketHeat || b.abilityStats?.marketHeat || 0) - (a.marketData?.marketHeat || a.abilityStats?.marketHeat || 0);
      });
      return list;
    }

    function topCards(type, limit = 10, sport = "all"){
      const source = Store.state?.cards || StarterCards;
      const filtered = sport === "all" ? source : source.filter((card) => card.sport === sport);
      return filtered.slice().sort((a,b) => {
        if(type === "value") return ValueModel.estimate(b) - ValueModel.estimate(a);
        if(type === "social") return (b.marketData?.socialInfluence || 0) - (a.marketData?.socialInfluence || 0);
        if(type === "recent") return new Date(b.lastUpdate) - new Date(a.lastUpdate);
        if(type === "watchlist") return Number(Store.state?.watchlist?.includes(b.id) || 0) - Number(Store.state?.watchlist?.includes(a.id) || 0);
        return (b.marketData?.marketHeat || b.abilityStats?.marketHeat || 0) - (a.marketData?.marketHeat || a.abilityStats?.marketHeat || 0);
      }).slice(0, limit);
    }

    function undervaluedCards(limit = 10){
      const source = Store.state?.cards || StarterCards;
      return source.slice().sort((a,b) => undervaluedScore(b) - undervaluedScore(a)).slice(0, limit);
    }

    function undervaluedScore(card){
      return (card.abilityStats?.ovr || 70) + (card.marketData?.marketHeat || 50) - ValueModel.estimate(card) * 8;
    }

    function achievementList(){
      const owned = Store.ownedCards();

      ];
    }

    const ValueModel = {
      score(card){
        const rarityWeight = Rarity[card.rarity]?.weight || 1;
        const badgeBoost = (card.badges?.length || 0) * .06;
        const versionBoost = Math.max(0, (card.version || 1) - 1) * .035;
        const statBoost = Object.values(card.stats || {}).reduce((sum, value) => sum + Math.min(Number(value) || 0, 120) / 900, 0);
        return 1 + rarityWeight * .08 + badgeBoost + versionBoost + statBoost;
      },
      breakdown(card){
        const basePrice = Number(card.price || .1);
        const rarityMultiplier = Rarity[card.rarity]?.multiplier || 1;
        const ability = card.abilityStats || {};
        const legacy = card.legacyStats || {};
        const performanceScore = clamp(.82 + (ability.ovr || 75) / 125 + Object.values(card.stats || {}).reduce((sum, value) => sum + Math.min(Math.abs(Number(value) || 0), 150) / 3000, 0), .85, 1.95);
        const socialInfluence = clamp((card.marketData?.socialInfluence || 58) / 70, .72, 1.5);
        const marketHeat = clamp((card.marketData?.marketHeat || ability.marketHeat || 60) / 72, .72, 1.45);
        const collectorDemand = clamp(((card.marketData?.collectorDemand || 60) + (legacy.collectorDemand || 0) * .18) / 75, .74, 1.5);
        const recentEventBoost = clamp(1 + Math.min((card.version || 1) - 1, 12) * .018 + (card.status !== "Active" ? .035 : 0), 1, 1.34);
        const estimatedValue = clamp(basePrice * rarityMultiplier * performanceScore * socialInfluence * marketHeat * collectorDemand * recentEventBoost, .01, 999);
        return {basePrice, rarityMultiplier, performanceScore, socialInfluence, marketHeat, collectorDemand, recentEventBoost, estimatedValue};
      },
      estimate(card){
        return this.breakdown(card).estimatedValue;
      }
    };

    const Metadata = {
      forCard(card){
        const sport = Sports[card.sport] || Sports.soccer;
        const valuation = ValueModel.breakdown(card);
        const intro = card.introAnimation || getIntroAnimation(card);

        const attrs = [

          ["history","version", `v${card.version}`],
          ["market","estimated_value_eth", money(valuation.estimatedValue)]
        ].map(([category, trait_type, value]) => ({category, trait_type, value}));
        Object.entries(card.stats || {}).forEach(([key, value]) => attrs.push({category:"stats", trait_type:StatLabels[key] || key, value:formatStat(key, value)}));

        Object.entries(card.legacyStats || {}).forEach(([key, value]) => attrs.push({category:"legacy", trait_type:key, value}));
        Object.entries(card.socialLinks || {}).filter(([, value]) => socialUrl(value)).forEach(([key, value]) => attrs.push({category:"social", trait_type:key, value:socialUrl(value)}));
        return {
          token_id:card.tokenId,

          socialLinks:card.socialLinks || emptySocialLinks(),

          image_source_status:card.imageSourceStatus || (card.imageUrl ? "official image seed / demo use" : "fallback generated card art"),

        };
      }
    };

    const EventSets = {

      legacy:[

          card.legacyStats = card.legacyStats || legacyStatsFor(card);
          card.legacyStats.legacyScore = clamp((card.legacyStats.legacyScore || 60) + 5, 1, 99);
          card.legacyStats.historicalImpact = clamp((card.legacyStats.historicalImpact || 60) + 4, 1, 99);
          addBadge(card,"Legacy Moment"); promote(card,"epic"); card.status = "Legacy Edition";
        }},
        {id:"hall_of_fame", icon:"HF", title:"Hall of Fame", impact:"名人堂級紀念，收藏需求上升", effect:"award", apply(card){
          card.legacyStats = card.legacyStats || legacyStatsFor(card);
          card.legacyStats.legacyScore = clamp((card.legacyStats.legacyScore || 60) + 8, 1, 99);
          card.legacyStats.collectorDemand = clamp((card.legacyStats.collectorDemand || 60) + 7, 1, 99);
          addBadge(card,"Hall of Fame"); promote(card,"legendary"); card.status = "Icon Edition";
        }},
        {id:"record_anniversary", icon:"RA", title:"Record Anniversary", impact:"紀錄週年推升 Market Heat", effect:"goal", apply(card){
          card.legacyStats = card.legacyStats || legacyStatsFor(card);
          card.legacyStats.culturalInfluence = clamp((card.legacyStats.culturalInfluence || 60) + 5, 1, 99);
          addBadge(card,"Record Anniversary"); promote(card,"rare");
        }},
        {id:"jersey_retirement", icon:"JR", title:"Jersey Retirement", impact:"球衣退休紀念，解鎖收藏徽章", effect:"award", apply(card){
          card.legacyStats = card.legacyStats || legacyStatsFor(card);
          card.legacyStats.collectorDemand = clamp((card.legacyStats.collectorDemand || 60) + 6, 1, 99);
          addBadge(card,"Jersey Retirement"); promote(card,"mythic"); card.status = "Retired Number Edition";
        }}
      ],
      global:[
        {id:"transfer", icon:"TR", title:"轉隊 / 版本更新", impact:"隊名改為 Special Edition，記錄 team 欄位變化", effect:"goal", apply(card){

          card.team = `${card.team} Special Edition`;

          card.status = "Team Updated";
          addBadge(card,"Team Update");

          addBadge(card,"MVP / Champion"); promote(card,"legendary"); card.status = "Award Edition";
        }}
      ]
    };

    function isLegacyCard(card){
      return ["Retired","Legend","Historical"].includes(card.playerEra);
    }

    function eventPoolFor(card){
      return [...(isLegacyCard(card) ? EventSets.legacy : (EventSets[card.sport] || [])), ...EventSets.global];
    }

    function formatStat(key, value){
      const number = Number(value);
      if(["avg","ops","whip"].includes(key)) return number.toFixed(3).replace(/^0/,"");
      if(["passPct","fgPct"].includes(key)) return `${number.toFixed(1)}%`;
      if(["points","rebounds","assists","steals","blocks","era"].includes(key)) return number.toFixed(1);
      return Number.isFinite(number) ? String(Math.round(number)) : String(value ?? "-");
    }

    function inc(card, key, amount){
      const current = Number(card.stats?.[key] ?? 0);
      const next = current + amount;
      const decimals = ["avg","ops","whip"].includes(key) ? 3 : ["points","rebounds","assists","steals","blocks","fgPct","passPct","era"].includes(key) ? 1 : 0;
      card.stats[key] = Number(next.toFixed(decimals));
    }

    function addBadge(card, badge){
      card.badges = Array.isArray(card.badges) ? card.badges : [];
      if(!card.badges.includes(badge)) card.badges.unshift(badge);
      card.badges = card.badges.slice(0, 8);
    }

    function promote(card, target){
      const currentIndex = rarityOrder.indexOf(card.rarity);
      const targetIndex = rarityOrder.indexOf(target);
      if(targetIndex > currentIndex) card.rarity = target;
    }

    function snapshotCard(card){
      return {
        stats:clone(card.stats || {}),
        abilityStats:clone(card.abilityStats || {}),
        legacyStats:clone(card.legacyStats || {}),
        rarity:card.rarity,
        value:ValueModel.estimate(card),
        version:card.version
      };
    }

    function applyOracleBoost(card, event){
      card.abilityStats = card.abilityStats || abilityFor(card.sport, card.position, card.rarity, 25);
      card.marketData = ensureMarketData(card);
      const boost = event.id === "injury" ? -3 : event.id === "transfer" ? 2 : event.id === "award" ? 6 : event.id === "triple_double" || event.id === "hat_trick" || event.id === "no_hitter" ? 5 : 3;
      card.abilityStats.marketHeat = clamp((card.abilityStats.marketHeat || 60) + boost * 2, 1, 99);
      card.abilityStats.clutch = clamp((card.abilityStats.clutch || 60) + (event.id === "injury" ? -2 : boost), 1, 99);
      card.abilityStats.potential = clamp((card.abilityStats.potential || 60) + (boost > 3 ? 1 : 0), 1, 99);
      card.abilityStats.ovr = clamp((card.abilityStats.ovr || 70) + (boost > 4 ? 1 : 0) + (event.id === "injury" ? -1 : 0), 1, 99);
      card.marketData.marketHeat = card.abilityStats.marketHeat;
      card.marketData.collectorDemand = clamp((card.marketData.collectorDemand || 60) + boost, 1, 99);
      card.marketData.recentEventBoost = boost;
      card.legacyStats = card.legacyStats || legacyStatsFor(card);
      if(isLegacyCard(card) || String(event.id).includes("legacy") || ["hall_of_fame","record_anniversary","jersey_retirement"].includes(event.id)){
        card.legacyStats.legacyScore = clamp((card.legacyStats.legacyScore || 60) + Math.max(2, boost), 1, 99);
        card.legacyStats.historicalImpact = clamp((card.legacyStats.historicalImpact || 60) + Math.max(1, boost - 1), 1, 99);
        card.legacyStats.culturalInfluence = clamp((card.legacyStats.culturalInfluence || 60) + Math.max(1, boost), 1, 99);
        card.legacyStats.collectorDemand = clamp((card.legacyStats.collectorDemand || 60) + Math.max(2, boost), 1, 99);
      }
      if(event.id === "award") promote(card,"legendary");
      if(event.id === "no_hitter" || event.id === "hat_trick" || event.id === "triple_double") promote(card,"mythic");
    }

    function buildOracleDiff(card, event, before){
      const after = snapshotCard(card);
      const changes = [];
      Object.keys({...before.stats, ...after.stats}).forEach((key) => {
        if(String(before.stats[key]) !== String(after.stats[key])) changes.push({type:"stat", key, before:formatStat(key, before.stats[key] ?? 0), after:formatStat(key, after.stats[key] ?? 0)});
      });
      ["ovr","marketHeat","potential","clutch"].forEach((key) => {
        if(before.abilityStats[key] !== after.abilityStats[key]) changes.push({type:"ability", key, before:before.abilityStats[key], after:after.abilityStats[key]});
      });
      Object.keys({...before.legacyStats, ...after.legacyStats}).forEach((key) => {
        if(before.legacyStats[key] !== after.legacyStats[key]) changes.push({type:"legacy", key, before:before.legacyStats[key] ?? 0, after:after.legacyStats[key] ?? 0});
      });
      if(before.rarity !== after.rarity) changes.push({type:"rarity", key:"rarity", before:Rarity[before.rarity]?.label || before.rarity, after:Rarity[after.rarity]?.label || after.rarity});
      changes.push({type:"market", key:"estimatedValue", before:`${money(before.value)} ETH`, after:`${money(after.value)} ETH`});
      return {
        status:["Pending","Verifying","Confirmed","Metadata Updated"],
        payload:{
          eventType:event.id,
          playerId:card.id,
          playerName:card.playerName,
          source:"Manual Oracle Demo",
          verified:true,
          timestamp:nowISO(),
          changes,
          metadataVersion:card.version + 1,
          oracleStatus:"Metadata Updated",
          txHash:`0xora${Date.now().toString(16)}`
        },
        changes
      };
    }

    const Actions = {
      mint(cardId){
        return this.mintPrimary(cardId);
      },
      mintPrimary(cardId){
        const card = Store.card(cardId);
        if(!card) return UI.toast("找不到卡片", "此卡片不存在。", "NO");
        if(card.owner === "demo_wallet") return UI.toast("已在收藏庫", `${card.playerName} 已完成 Mint。`, "OK");
        if(card.owner && card.owner !== "issuer") return this.secondaryBuy(cardId);
        if(Store.state.wallet < card.price) return UI.toast("餘額不足", "Demo Wallet ETH 不足，無法購買。", "!");
        Store.state.wallet = Number((Store.state.wallet - card.price).toFixed(4));
        card.owner = "demo_wallet";
        card.marketData = ensureMarketData(card);
        card.marketData.owner = "demo_wallet";
        card.marketData.listed = false;
        card.marketData.seller = "";
        card.marketData.lastSale = Number(card.price);
        card.marketData.volume = Number(((card.marketData.volume || 0) + Number(card.price)).toFixed(2));
        card.marketData.priceHistory = card.marketData.priceHistory || [];
        card.marketData.priceHistory.unshift({at:nowISO(), type:"Mint", price:Number(card.price), status:"Confirmed"});
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history = card.history || [];
        const receipt = tradeReceipt("MINT", "issuer", "demo_wallet", card.price);
        card.history.unshift({at:card.lastUpdate, type:"MINT", note:`Minted from primary market for ${money(card.price)} ETH.`, receipt});
        Store.state.lastTradeReceipt = receipt;
        Store.state.activeOracleId = Store.state.activeOracleId || card.id;
        this.log("MINT", card, `一級市場 Mint：${card.playerName}`, -card.price);
        Store.save();
        UI.render();
        UI.toast("購買成功", `${card.playerName} 已加入收藏庫。`, "OK");
      },
      burn(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return;
        const refund = Number((ValueModel.estimate(card) * .52).toFixed(4));
        Store.state.wallet = Number((Store.state.wallet + refund).toFixed(4));
        card.owner = null;
        card.marketData = ensureMarketData(card);
        card.marketData.owner = "issuer";
        card.marketData.listed = false;
        card.marketData.seller = "";
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history.unshift({at:card.lastUpdate, type:"DEMO_RETURN", note:`Demo return redeemed ${refund} ETH.`});
        this.log("DEMO_RETURN", card, `Demo 回收：${card.playerName}`, refund);
        if(Store.state.activeOracleId === card.id) Store.state.activeOracleId = Store.ownedCards()[0]?.id || null;
        Store.save();
        UI.render();
        UI.toast("已回收", `${card.playerName} 已從收藏庫移回市場。`, "OK");
      },
      sendOracle(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("尚未收藏", "請先 Mint 卡片再送入預言機。", "!");
        Store.state.activeOracleId = card.id;
        Store.state.activeView = "oracle";
        Store.save();
        UI.render();
      },
      oracleEvent(eventId){
        const card = Store.card(Store.state.activeOracleId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("未選擇卡片", "請先選擇收藏庫中的卡片。", "!");
        const event = eventPoolFor(card).find((item) => item.id === eventId);
        if(!event) return;
        const beforeSnapshot = snapshotCard(card);
        const before = Metadata.forCard(card);
        event.apply(card);
        applyOracleBoost(card, event);
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history = card.history || [];
        card.history.unshift({
          at:card.lastUpdate,
          type:`ORACLE_${event.id.toUpperCase()}`,
          note:`${event.title} applied. Metadata v${card.version} generated from manual oracle input.`
        });
        Store.state.lastEffect = {cardId:card.id, effect:event.effect, at:Date.now()};
        Store.state.lastOracleDiff = buildOracleDiff(card, event, beforeSnapshot);
        card.metadataVersions = card.metadataVersions || [];
        card.metadataVersions.unshift({version:card.version, at:card.lastUpdate, reason:event.title, diff:Store.state.lastOracleDiff.changes});
        this.log("ORACLE", card, `${event.title} 更新：${before.rarity} -> ${Rarity[card.rarity]?.label || card.rarity}`, 0);
        Store.save();
        UI.render();
        UI.toast("預言機已更新", `${card.playerName} v${card.version} metadata 已刷新。`, "OK");
      },
      buyNow(cardId){
        const card = Store.card(cardId);
        if(!card) return;
        if(card.owner === "demo_wallet") return UI.toast("已擁有", `${card.playerName} 已在收藏庫。`, "OK");
        if(!card.owner || card.owner === "issuer") return this.mintPrimary(cardId);
        if(card.marketData?.listed) return this.secondaryBuy(cardId);
        return UI.toast("尚未掛單", "此卡片尚未在二級市場掛單出售，可以先 Make Offer。", "!");
      },
      secondaryBuy(cardId){
        const card = Store.card(cardId);
        if(!card) return;
        card.marketData = ensureMarketData(card);
        if(card.owner === "demo_wallet") return UI.toast("已擁有", `${card.playerName} 已在你的收藏庫。`, "OK");
        if(!card.owner || card.owner === "issuer") return this.mintPrimary(cardId);
        if(!card.marketData.listed) return UI.toast("Not Listed", "此卡目前沒有二級市場掛單，可先 Make Offer。", "!");
        const askingPrice = Number(card.marketData.askingPrice || ValueModel.estimate(card));
        const gas = Number((card.marketData.gasFee || .003).toFixed(4));
        const total = Number((askingPrice + gas).toFixed(4));
        if(Store.state.wallet < total) return UI.toast("餘額不足", `Buy Now 需要 ${money(total)} ETH（含 Gas）。`, "!");
        const from = card.owner || card.marketData.owner || "collector";
        Store.state.wallet = Number((Store.state.wallet - total).toFixed(4));
        const receipt = tradeReceipt("SECONDARY_BUY", from, "demo_wallet", askingPrice, gas);
        card.owner = "demo_wallet";
        card.marketData.owner = "demo_wallet";
        card.marketData.listed = false;
        card.marketData.seller = "";
        card.marketData.lastSale = askingPrice;
        card.marketData.volume = Number(((card.marketData.volume || 0) + askingPrice).toFixed(2));
        card.marketData.priceHistory = card.marketData.priceHistory || [];
        card.marketData.priceHistory.unshift({at:nowISO(), type:"Secondary Buy", price:askingPrice, status:"Confirmed"});
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history = card.history || [];
        card.history.unshift({at:card.lastUpdate, type:"SECONDARY_BUY", note:`Buy Now from ${from} for ${money(askingPrice)} ETH plus ${money(gas)} gas.`, receipt});
        Store.state.activeOracleId = card.id;
        Store.state.lastTradeReceipt = receipt;
        this.log("SECONDARY_BUY", card, `二級市場 Buy Now：${card.playerName} ${money(askingPrice)} ETH`, -total);
        Store.save();
        UI.render();
        UI.toast("交易確認", `${card.playerName} 已完成二級市場 Buy Now。`, "TX");
      },
      listForSale(cardId, rawPrice){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("尚未收藏", "只有持有者可以掛單出售。", "!");
        card.marketData = ensureMarketData(card);
        const askingPrice = Number(rawPrice);
        if(!Number.isFinite(askingPrice) || askingPrice <= 0) return UI.toast("價格無效", "請輸入大於 0 的 ETH 掛單價格。", "!");
        card.marketData.listed = true;
        card.marketData.listingType = "secondary";
        card.marketData.seller = "demo_wallet";
        card.marketData.owner = "demo_wallet";
        card.marketData.askingPrice = Number(askingPrice.toFixed(4));
        card.history = card.history || [];
        card.history.unshift({at:nowISO(), type:"LIST_FOR_SALE", note:`Listed for ${money(card.marketData.askingPrice)} ETH.`});
        this.log("LIST", card, `List for sale: ${card.playerName} ${money(card.marketData.askingPrice)} ETH`, 0);
        Store.save();
        UI.render();
        UI.openDetail(card.id, {skipIntro:true});
        UI.toast("掛單成功", `${card.playerName} 已掛單 ${money(card.marketData.askingPrice)} ETH。`, "OK");
      },
      cancelListing(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return;
        card.marketData = ensureMarketData(card);
        card.marketData.listed = false;
        card.marketData.seller = "";
        card.history = card.history || [];
        card.history.unshift({at:nowISO(), type:"CANCEL_LISTING", note:"Owner cancelled the secondary market listing."});
        this.log("CANCEL_LISTING", card, `Cancel listing: ${card.playerName}`, 0);
        Store.save();
        UI.render();
        UI.openDetail(card.id, {skipIntro:true});
        UI.toast("已取消掛單", `${card.playerName} 已從二級市場下架。`, "OK");
      },
      makeOffer(cardId){
        const card = Store.card(cardId);
        if(!card) return;
        card.marketData = ensureMarketData(card);
        const price = Number((ValueModel.estimate(card) * (.86 + Math.random() * .1)).toFixed(2));
        const from = card.owner === "demo_wallet" ? `collector_${Math.floor(1000 + Math.random() * 8999)}` : "demo_wallet";
        const offer = {id:uid("offer"), from, price, at:nowISO(), status:"Pending"};
        card.marketData.offers = card.marketData.offers || [];
        card.marketData.offers.unshift(offer);
        card.history = card.history || [];
        card.history.unshift({at:offer.at, type:"MAKE_OFFER", note:`${offer.from} offered ${money(price)} ETH.`});
        this.log("OFFER", card, `Offer created: ${money(price)} ETH`, 0);
        Store.save();
        UI.render();
        if(Store.state.activeDetailId === card.id) UI.openDetail(card.id, {skipIntro:true});
        UI.toast("出價已建立", `${card.playerName} 新增 ${money(price)} ETH 出價。`, "OK");
      },
      acceptOffer(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("無法接受", "只有持有者可以接受出價。", "!");
        card.marketData = ensureMarketData(card);
        const offer = (card.marketData.offers || []).find((item) => item.status === "Pending");
        if(!offer) return UI.toast("No Active Offer", "目前沒有可接受的待處理出價。", "!");
        offer.status = "Accepted";
        card.marketData.offers.forEach((item) => {
          if(item.id !== offer.id && item.status === "Pending") item.status = "Expired";
        });
        const gas = Number((card.marketData.gasFee || .003).toFixed(4));
        const royalty = Number((offer.price * (Number(card.marketData.creatorRoyalty || 0) / 100)).toFixed(4));
        const proceeds = Number((offer.price - gas - royalty).toFixed(4));
        Store.state.wallet = Number((Store.state.wallet + proceeds).toFixed(4));
        const receipt = tradeReceipt("SECONDARY_SALE", "demo_wallet", offer.from, offer.price, gas);
        receipt.royalty = royalty;
        receipt.netProceeds = proceeds;
        card.owner = offer.from;
        card.marketData.owner = offer.from;
        card.marketData.listed = false;
        card.marketData.seller = "";
        card.marketData.lastSale = offer.price;
        card.marketData.volume = Number(((card.marketData.volume || 0) + offer.price).toFixed(2));
        card.marketData.priceHistory = card.marketData.priceHistory || [];
        card.marketData.priceHistory.unshift({at:nowISO(), type:"Sale", price:offer.price, status:"Confirmed"});
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history = card.history || [];
        card.history.unshift({at:nowISO(), type:"ACCEPT_OFFER", note:`Accepted ${money(offer.price)} ETH offer from ${offer.from}.`, receipt});
        Store.state.lastTradeReceipt = receipt;
        this.log("SALE", card, `Accepted offer sale: ${card.playerName} ${money(offer.price)} ETH`, proceeds);
        Store.save();
        UI.render();
        UI.openDetail(card.id, {skipIntro:true});
        UI.toast("交易確認", `${card.playerName} 已售出，錢包增加 ${money(proceeds)} ETH。`, "TX");
      },
      toggleAnimation(){
        Store.state.animationEnabled = Store.state.animationEnabled === false ? true : false;
        Store.save();
        UI.render();
        UI.toast("動畫設定", `卡片預覽動畫 ${Store.state.animationEnabled ? "ON" : "OFF"}。`, "OK");
      },

      },
      toggleWatch(cardId){
        Store.state.watchlist = Store.state.watchlist || [];

          Store.state.watchlist = Store.state.watchlist.filter((id) => id !== cardId);
        }else{
          Store.state.watchlist.push(cardId);
        }
        const card = Store.card(cardId);
        if(card){
          card.marketData = ensureMarketData(card);
          card.marketData.watchlisted = Store.state.watchlist.includes(cardId);
        }
        Store.save();
        UI.render();
      },

          note,

        });

            case "cancel-listing": Actions.cancelListing(id); break;
            case "accept-offer": Actions.acceptOffer(id); break;
            case "toggle-animation": Actions.toggleAnimation(); break;
            case "set-language": Actions.setLanguage(action.dataset.language); break;
            case "skip-intro": this.finishIntro(); break;
            case "replay-intro": this.playIntro(id || Store.state.activeDetailId, true); break;
            case "watch": Actions.toggleWatch(id); break;

            case "burn": Actions.burn(id); break;
            case "detail": this.openDetail(id); break;
            case "oracle": Actions.sendOracle(id); break;
            case "oracle-event": Actions.oracleEvent(action.dataset.eventId); break;
            case "copy-json": this.copyMetadata(id); break;
            case "download-json": this.downloadMetadata(id); break;
            case "copy-value": this.copyValue(action.dataset.copy, action.dataset.copyLabel); break;
            case "export-state": this.exportState(); break;
            case "reset-demo": this.resetDemo(); break;
            case "close-modal": this.closeModal(); break;
            case "add-card": this.addCustomCard(action.dataset.target || "market"); break;
          }

            Store.state.search = event.target.value;
            Store.state.visibleCount = 24;

            Store.state.filterSport = event.target.value;

            Store.save();

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Player Card Exchange v3</title>
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/layout.css">
  <link rel="stylesheet" href="./src/css/components.css">
  <link rel="stylesheet" href="./src/css/cards.css">
  <link rel="stylesheet" href="./src/css/market.css">
  <link rel="stylesheet" href="./src/css/modal.css">
  <link rel="stylesheet" href="./src/css/animations.css">
  <link rel="stylesheet" href="./src/css/studio.css">
  <link rel="stylesheet" href="./src/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DSP</div>
        <div>
          <h1>動態球員卡收藏</h1>
          <p>Dynamic NFT Player Cards</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <section class="wallet" aria-label="Demo Wallet">
        <div class="wallet-main">
          <div class="wallet-label"><span>DEMO WALLET</span><span id="collectionBadge">0 CARDS</span></div>
          <div class="wallet-value"><span id="walletBalance">12.50</span><small>ETH</small></div>
          <div class="meter"><span id="walletMeter"></span></div>
        </div>
        <div class="wallet-actions">
          <button class="btn" data-action="export-state" title="匯出資料">匯出</button>
          <button class="btn danger" data-action="reset-demo" title="重置 Demo">重置</button>
        </div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-title">
          <div class="page-seal" id="pageIcon">總</div>
          <div>
            <h2 id="pageTitle">總覽 Dashboard</h2>
            <p id="pageSubtitle">資料來源、事件判斷、metadata 更新與動態卡面展示。</p>
          </div>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>

      <div class="view-wrap">
        <section class="view active" id="view-dashboard"></section>
        <section class="view" id="view-market"></section>
        <section class="view" id="view-collection"></section>
        <section class="view" id="view-oracle"></section>
        <section class="view" id="view-datahub"></section>
        <section class="view" id="view-studio"></section>
      </div>
    </main>
  </div>

  <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <h3 id="modalTitle">Card Detail</h3>
        <button class="icon-btn" data-action="close-modal" aria-label="關閉">X</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-inner">
      <div class="toast-icon" id="toastIcon">OK</div>
      <div>
        <strong id="toastTitle">通知</strong>
        <span id="toastMsg">Message</span>
      </div>
    </div>
  </div>

  <script src="./src/js/utils.js"></script>
  <script src="./src/data/licenseNotes.js"></script>
  <script src="./src/data/sportsConfig.js"></script>
  <script src="./src/data/rarityConfig.js"></script>
  <script src="./src/js/config.js"></script>
  <script src="./src/data/playerSocialLinks.js"></script>
  <script src="./src/data/mlbPlayerIds.js"></script>
  <script src="./src/data/teamLogos.js"></script>
  <script src="./src/data/players.soccer.top100.js"></script>
  <script src="./src/data/players.basketball.top100.js"></script>
  <script src="./src/data/players.baseball.top100.js"></script>
  <script src="./src/data/marketSeeds.js"></script>
  <script src="./src/data/players.featured.js"></script>
  <script src="./src/data/playerProfiles.localized.js"></script>
  <script src="./src/data/animationPresets.js"></script>
  <script src="./src/js/imageResolver.js"></script>
  <script src="./src/js/i18n.js"></script>
  <script src="./src/js/animations.js"></script>
  <script src="./src/js/marketSimulator.js"></script>
  <script src="./src/js/store.js"></script>
  <script src="./src/js/valueModel.js"></script>
  <script src="./src/js/metadata.js"></script>
  <script src="./src/js/oracle.js"></script>
  <script src="./src/js/priceHistory.js"></script>
  <script src="./src/js/actions.js"></script>
  <script src="./src/js/ui/renderApp.js"></script>
  <script src="./src/js/ui/renderDashboard.js"></script>
  <script src="./src/js/ui/renderMarket.js"></script>
  <script src="./src/js/ui/renderCollection.js"></script>
  <script src="./src/js/ui/renderOracle.js"></script>
  <script src="./src/js/ui/renderDataHub.js"></script>
  <script src="./src/js/ui/renderStudio.js"></script>
  <script src="./src/js/ui/renderCard.js"></script>
  <script src="./src/js/ui/renderModal.js"></script>
  <script src="./src/js/studio.js"></script>
  <script src="./src/js/ui/renderToast.js"></script>
  <script src="./src/js/main.js"></script>
</body>
</html>
